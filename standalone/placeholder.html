<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DemonMC Network — Coming Soon</title>
  <meta name="description" content="The DemonMC network website is being prepared. Join the Discord for updates." />
  <meta name="theme-color" content="#050506" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      color-scheme: dark;
      --bg: #050506;
      --line: rgba(255, 255, 255, 0.08);
      --muted: #a1a1aa;
      --dim: #71717a;
      --ember: #ff2d3f;
      --ember-bright: #ff5866;
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100svh;
      margin: 0;
      place-items: center;
      overflow-x: hidden;
      background: var(--bg);
      color: #f4f4f5;
      -webkit-font-smoothing: antialiased;
      background-image:
        radial-gradient(800px 500px at 50% 10%, rgba(255, 45, 63, 0.14), transparent 65%),
        radial-gradient(600px 400px at 0% 100%, rgba(255, 255, 255, 0.025), transparent 65%);
      padding: 24px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 72px 72px;
      opacity: 0.45;
      -webkit-mask-image: radial-gradient(ellipse 65% 60% at 50% 40%, #000 10%, transparent 78%);
      mask-image: radial-gradient(ellipse 65% 60% at 50% 40%, #000 10%, transparent 78%);
    }

    .card {
      width: min(100%, 520px);
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(10, 10, 12, 0.78);
      padding: 44px 32px;
      text-align: center;
      box-shadow: 0 30px 90px -40px rgba(0, 0, 0, 1);
      backdrop-filter: blur(14px);
      animation: rise 700ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }

    .logo {
      display: inline-flex;
      width: 58px;
      height: 58px;
      align-items: center;
      justify-content: center;
    }

    .logo svg {
      width: 100%;
      height: 100%;
    }

    h1 {
      margin: 22px 0 0;
      font-family: "Sora", "Inter", system-ui, sans-serif;
      font-size: clamp(2rem, 8vw, 2.8rem);
      font-weight: 800;
      letter-spacing: 0.05em;
      line-height: 1;
      text-transform: uppercase;
    }

    h1 span {
      color: var(--ember);
    }

    .eyebrow {
      margin: 12px 0 0;
      color: var(--dim);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.4em;
      text-transform: uppercase;
    }

    p {
      max-width: 390px;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.75;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 30px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 12px 20px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .button-primary {
      background: var(--ember);
      box-shadow: 0 14px 40px -14px rgba(255, 45, 63, 0.8);
    }

    .button-primary:hover {
      background: var(--ember-bright);
    }

    .button-ghost {
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.03);
    }

    .button-ghost:hover {
      border-color: rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.07);
    }

    .button:focus-visible {
      outline: 2px solid rgba(255, 88, 102, 0.8);
      outline-offset: 3px;
    }

    footer {
      margin-top: 28px;
      color: #3f3f46;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .card {
        padding: 36px 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">
      <svg viewBox="0 0 48 48" role="img" aria-label="DemonMC logo">
        <rect x="1.5" y="1.5" width="45" height="45" rx="10" fill="#0b0b0e" stroke="rgba(255,255,255,0.14)" />
        <rect x="1.5" y="1.5" width="45" height="45" rx="10" fill="none" stroke="rgba(255,45,63,0.35)" />
        <path
          d="M16 12.5h9.6C32.9 12.5 37.5 17 37.5 24s-4.6 11.5-11.9 11.5H16v-23Zm7 6.2v10.6h2.4c3.4 0 5.2-1.9 5.2-5.3s-1.8-5.3-5.2-5.3h-2.4Z"
          fill="#ff2d3f"
        />
      </svg>
    </div>

    <h1>Demon<span>MC</span></h1>
    <p class="eyebrow">Minecraft Network</p>

    <p>
      The network website is being prepared. Join the Discord for updates, events and
      announcements while we finish building.
    </p>

    <div class="actions">
      <a
        class="button button-primary"
        href="https://discord.gg/mFYwCJBTuA"
        target="_blank"
        rel="noopener noreferrer"
      >
        Join the Discord
      </a>
      <a class="button button-ghost" href="mailto:hello@example.com">Contact us</a>
    </div>

    <footer>&copy; <span id="year">2026</span> DemonMC Network</footer>
  </main>

  <script>
    var year = document.getElementById("year");
    if (year) year.textContent = String(new Date().getFullYear());
  </script>
</body>
</html>
